name: kodm-monitor

services:
  monitor:
    build: .
    image: kodm-monitor:latest
    pull_policy: build # registry'den çekmeye çalışma, local'de derle (Portainer update hatasını önler)
    container_name: kodm-monitor
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false # Portainer/git kurulumunda .env olmayabilir; değişkenler arayüzden verilir
    environment:
      PORT: 4000
    cap_add:
      - NET_RAW # ping (ICMP) için gerekli
    volumes:
      # Host'taki gizli env dosyası (şifreler git'e girmez, entrypoint okur).
      # Hostta hazır: /home/baskan/kodm-monitor/.env (chmod 600)
      - /home/baskan/kodm-monitor:/run/kodm-env:ro
    restart: unless-stopped

    # NOT: ARP taraması ve mDNS/SSDP cihaz keşfi, container ile aynı LAN'ı
    # görmeyi gerektirir. Linux bir hostta çalıştırıyorsan (örn. 192.168.41.119
    # üzerindeki Portainer) aşağıdaki satırı açman önerilir:
    # network_mode: host
